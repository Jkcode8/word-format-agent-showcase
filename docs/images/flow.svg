<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500"
     role="img" aria-label="排版助手处理流程：选样式上传、只读预检、角色标注、逐段核对、写入命名样式、三件套交付">
  <defs>
    <style>
      .stage { fill: #ffffff; stroke: #e3ded6; stroke-width: 1; }
      .support { fill: #ffffff; stroke: #e3ded6; stroke-width: 1; }
      .mono { font: 500 11px ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #8a8178; letter-spacing: .16em; }
      .num { font: 600 13px ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #a49a8e; letter-spacing: .06em; }
      .t { font: 600 15px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; fill: #1f1d1a; }
      .s { font: 400 11.5px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; fill: #6b6259; }
      .note { font: 400 12px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; fill: #6b6259; }
      .accent { fill: #3f6f52; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9c2b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="500" rx="18" fill="#faf8f5"/>

  <text class="mono" x="24" y="36">FORMAT SEQUENCE</text>
  <text class="mono" x="976" y="36" text-anchor="end">排版助手 · 处理流程</text>

  <!-- 六个阶段 -->
  <g>
    <rect class="stage" x="20" y="56" width="147" height="96" rx="12"/>
    <text class="num" x="36" y="82">01</text>
    <text class="t" x="36" y="106">选样式并上传</text>
    <text class="s" x="36" y="128">.docx / .doc / .rtf</text>
    <text class="s" x="36" y="144">.odt / .wps</text>
  </g>
  <g>
    <rect class="stage" x="184" y="56" width="147" height="96" rx="12"/>
    <text class="num" x="200" y="82">02</text>
    <text class="t" x="200" y="106">只读预检</text>
    <text class="s" x="200" y="128">段数 / 样式 / 域</text>
    <text class="s" x="200" y="144">表格 / 分节 / 修订</text>
  </g>
  <g>
    <rect class="stage" x="348" y="56" width="147" height="96" rx="12"/>
    <text class="num" x="364" y="82">03</text>
    <text class="t" x="364" y="106">角色标注</text>
    <text class="s" x="364" y="128">离线规则判定</text>
    <text class="s" x="364" y="144">可选模型增强</text>
  </g>
  <g>
    <rect class="stage" x="512" y="56" width="147" height="96" rx="12"/>
    <text class="num" x="528" y="82">04</text>
    <text class="t" x="528" y="106">逐段核对</text>
    <text class="s" x="528" y="128">按判定依据逐段看</text>
    <text class="s" x="528" y="144">可订正 / 可导出复用</text>
  </g>
  <g>
    <rect class="stage" x="676" y="56" width="147" height="96" rx="12"/>
    <text class="num" x="692" y="82">05</text>
    <text class="t" x="692" y="106">写入命名样式</text>
    <text class="s" x="692" y="128">格式正文 / 格式标题</text>
    <text class="s" x="692" y="144">图题 / 表题 / 目录标题</text>
  </g>
  <g>
    <rect class="stage" x="840" y="56" width="140" height="96" rx="12"/>
    <text class="num" x="856" y="82">06</text>
    <text class="t" x="856" y="106">三件套交付</text>
    <text class="s" x="856" y="128">主稿 / 修订稿</text>
    <text class="s" x="856" y="144">修改报告</text>
  </g>

  <!-- 阶段之间的箭头 -->
  <g stroke="#c9c2b8" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="169" y1="104" x2="181" y2="104"/>
    <line x1="333" y1="104" x2="345" y2="104"/>
    <line x1="497" y1="104" x2="509" y2="104"/>
    <line x1="661" y1="104" x2="673" y2="104"/>
    <line x1="825" y1="104" x2="837" y2="104"/>
  </g>

  <!-- 格式来源 -->
  <text class="mono" x="24" y="196">格式来源</text>
  <g>
    <rect class="support" x="20" y="208" width="308" height="84" rx="12"/>
    <text class="t" x="38" y="236">公司样式库（JSON）</text>
    <text class="s" x="38" y="258">公司内文样式 · 公文标准示例；页面几何、</text>
    <text class="s" x="38" y="274">59 个角色的字体字号行距缩进</text>
  </g>
  <g>
    <rect class="support" x="346" y="208" width="308" height="84" rx="12"/>
    <text class="t" x="364" y="236">自定义配置 / 导入 JSON</text>
    <text class="s" x="364" y="258">面板里逐项设置，或上传 FormatSpec</text>
    <text class="s" x="364" y="274">入库后长期复用</text>
  </g>
  <g>
    <rect class="support" x="672" y="208" width="308" height="84" rx="12"/>
    <text class="t" x="690" y="236">Word 模板解析</text>
    <text class="s" x="690" y="258">上传一份排版正确的文档，按"生效属性"</text>
    <text class="s" x="690" y="274">读出生效格式并写进样式库</text>
  </g>

  <!-- 交付 -->
  <text class="mono" x="24" y="330">交付</text>
  <g>
    <rect class="support" x="20" y="342" width="308" height="76" rx="12"/>
    <text class="t" x="38" y="370">主稿</text>
    <text class="s" x="38" y="392">⟨原名⟩_排版结果.docx — 直接交这份</text>
  </g>
  <g>
    <rect class="support" x="346" y="342" width="308" height="76" rx="12"/>
    <text class="t" x="364" y="370">修订稿</text>
    <text class="s" x="364" y="392">⟨原名⟩_排版结果_tracked.docx — 逐条接受/拒绝</text>
  </g>
  <g>
    <rect class="support" x="672" y="342" width="308" height="76" rx="12"/>
    <text class="t" x="690" y="370">修改报告</text>
    <text class="s" x="690" y="392">⟨原名⟩_排版结果_report.docx — 逐段对照</text>
  </g>

  <text class="note" x="24" y="452">源文件一个字节都不改</text>
  <circle class="accent" cx="188" cy="448" r="3"/>
  <text class="note" x="200" y="452">全程本机、不联网</text>
  <circle class="accent" cx="318" cy="448" r="3"/>
  <text class="note" x="330" y="452">文本零改动校验（文字不一致直接判失败）</text>
  <circle class="accent" cx="552" cy="448" r="3"/>
  <text class="note" x="564" y="452">随时"强制停止"，已排好的照常出稿</text>
  <text class="mono" x="976" y="452" text-anchor="end">V1.7.1</text>
</svg>
